name: Mac app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the native Mac app
        run: bash scripts/build-mac.sh

      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; version="${tag#v}"; fi
          notes=$(cat <<EOF
          Shotli ${version} for Mac.

          If you already have Shotli 0.2.2 or newer, choose Check for Updates in the menu bar. Shotli downloads the new version and replaces itself.

          Otherwise, open the disk image, drag Shotli onto the Applications folder, then open it from Applications. This is the last version you need to install that way.

          The first time you launch it, macOS may say the developer cannot be verified. Control-click Shotli, choose Open, then choose Open again. An update can ask for that again.

          Images stay on your Mac.
          EOF
          )
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Shotli ${version}" --notes "$notes" --latest
          fi
          gh release upload "$tag" dist/Shotli.dmg dist/Shotli-mac.zip --clobber
