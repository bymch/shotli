name: Mac app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the native Mac app
        run: bash scripts/build-mac.sh

      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; version="${tag#v}"; fi
          notes=$(cat <<EOF
          Shotli ${version} for Mac.

          Open the disk image. Drag Shotli onto the Applications folder, then open it from Applications.

          The first time you launch it, macOS may say the developer cannot be verified. Control-click Shotli, choose Open, then choose Open again.

          Images stay on your Mac.
          EOF
          )
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Shotli ${version}" --notes "$notes" --latest
          fi
          gh release upload "$tag" dist/Shotli.dmg dist/Shotli-mac.zip --clobber
